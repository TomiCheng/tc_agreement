[package]
name = "tc_jpake"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "J-PAKE password-authenticated key exchange after Bouncy Castle, with its standard prime-order groups."
readme = "README.md"
documentation = "https://docs.rs/tc_jpake"
keywords = ["jpake", "pake", "password", "key-exchange", "no-std"]
categories = ["cryptography", "authentication", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rand_core = { version = "0.10.1", default-features = false }
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_constant_time = "0.1.0"
tc_digest = "0.1.0"
tc_macs = { version = "0.1.0", features = ["alloc", "hmac"] }
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_prime = { version = "0.1.0", features = ["alloc"] }
tc_sha = "0.1.1"
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

[dev-dependencies]
rand = "0.10.3"
